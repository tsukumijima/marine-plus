[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-plus"
dynamic = ["version"]
description = "Marine: Multi-task learning based on Japanese accent estimation (Also supports Windows and Python 3.13)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = []
authors = [
    { name = "Byeongseon Park", email = "6gsn.park@gmail.com" },
]
classifiers = [
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]
dependencies = [
    "numpy>=1.21.0",
    "torch>=2.0.0",
    "hydra-core>=1.1.0",
    "hydra_colorlog>=1.1.0",
    "tqdm",
    "joblib",
    "pykakasi>=2.3.0",
]

[project.optional-dependencies]
pyopenjtalk = ["pyopenjtalk-plus"]

# 単体利用時の依存関係グループ
[dependency-groups]
## 開発用の依存関係
## Usage: uv sync --group dev
dev = [
    # リンター / フォーマッター / 型チェッカー / テスト
    "taskipy",
    "ruff",
    "pyright",
    "pytest",
    "pytest-cov",
    # 前処理関連
    "click",
    "httpx2",
    "fugashi-plus>=1.5.2.post1",
    "unidic>=1.1.0",
    "zipfile-inflate64>=0.1.0",
    # 学習関連
    "torchmetrics",
    "scikit-learn",
    "docstr-coverage",
    "tensorboard",
    "matplotlib",
    "pandas",
]
## ドキュメント生成用の依存関係
## Usage: uv sync --group docs
docs = [
    "sphinx",
    "sphinx-autobuild",
    "sphinx_rtd_theme",
    "nbsphinx>=0.8.6",
    "Jinja2>=3.0.1",
    "pandoc",
    "ipython",
    "jupyter",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["marine*"]
exclude = ["marine.bin.conf*"]
namespaces = false

[tool.setuptools.package-data]
marine = [
    "dict/*/*.tsv",
]

[tool.setuptools.dynamic]
version = { attr = "marine.__version__" }

# タスクランナーのタスク定義
## Usage: uv run task <task-name>
[tool.taskipy.tasks]
## リント・フォーマット
lint = "ruff check --fix . ; pyright"
format = "ruff format ."
typecheck = "pyright"
# テスト
test = "pytest"
# 前処理・学習スクリプト
download-unidic = "python -m marine.bin.download_unidic"
vvproj2yaml = "python -m marine.bin.vvproj2yaml"
validate-yaml-corpus = "python -m marine.bin.validate_yaml_corpus"
jsut2corpus = "python -m marine.bin.jsut2corpus"
make-raw-corpus = "python -m marine.bin.make_raw_corpus"
prepare-features-pyopenjtalk = "python -m marine.bin.prepare_features_pyopenjtalk"
visualize-wrong-mora-diff = "python -m marine.bin.visualize_wrong_mora_diff"
build-vocab = "python -m marine.bin.build_vocab"
pack-corpus = "python -m marine.bin.pack_corpus"
train-model = "python -m marine.bin.train"
test-model = "python -m marine.bin.test"
package-model = "python -m marine.bin.package_model"

[tool.ruff]
# 1行の長さを最大88文字に設定
line-length = 88
# インデントの幅を4スペースに設定
indent-width = 4
# Python 3.10 を利用する
target-version = "py310"

[tool.ruff.lint]
# flake8, pycodestyle, pyupgrade, isort, Ruff 固有のルールを使う
select = ["F", "E", "W", "UP", "I", "RUF"]
ignore = [
    "E501",    # 1行の長さを超えている場合の警告を抑制
    "E731",    # Do not assign a `lambda` expression, use a `def` を抑制
    "RUF001",  # 全角記号など `ambiguous unicode character` も使いたいため
    "RUF002",  # 全角記号など `ambiguous unicode character` も使いたいため
    "RUF003",  # 全角記号など `ambiguous unicode character` も使いたいため
    "RUF005",  # 万が一のリグレッション回避のため抑制
]

[tool.ruff.lint.isort]
# インポートブロックの後に2行空ける
lines-after-imports = 2

[tool.ruff.format]
# ダブルクオートを使う
quote-style = "double"
# インデントにはスペースを使う
indent-style = "space"

[tool.pyright]
# 型チェック対象の Python バージョンを指定
pythonVersion = "3.10"
# TypeCheckingMode を strict に設定（VSCode の設定と同等）
typeCheckingMode = "strict"
# プロジェクトルートを指定
pythonPlatform = "All"
# インクルードするパッケージパス
include = [
    "marine",
    "tests",
]
# 除外するパス
exclude = [
    "**/__pycache__",
    "**/.venv",
    "outputs/",
    "logs/",
    "recipe/",
]
# VSCode の settings.json の diagnosticSeverityOverrides に対応する設定
reportConstantRedefinition = "none"
reportDeprecated = "warning"
reportMissingTypeStubs = "none"
reportPrivateImportUsage = "none"
reportUnnecessaryComparison = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUntypedFunctionDecorator = "none"
reportUnusedFunction = "none"

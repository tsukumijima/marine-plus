# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu + Python 3.10 ~ 3.12 + NumPy 1.x
          # NumPy 1.x は Python 3.13 以降ではサポートされていない
          - os: ubuntu-latest
            python-version: '3.10'
            numpy-spec: 'numpy>=1.21.0,<2'
          - os: ubuntu-latest
            python-version: '3.11'
            numpy-spec: 'numpy>=1.21.0,<2'
          - os: ubuntu-latest
            python-version: '3.12'
            numpy-spec: 'numpy>=1.21.0,<2'
          # Ubuntu + Python 3.10 ~ 3.13 + NumPy 2.x
          - os: ubuntu-latest
            python-version: '3.10'
            numpy-spec: 'numpy>=2,<3'
          - os: ubuntu-latest
            python-version: '3.11'
            numpy-spec: 'numpy>=2,<3'
          - os: ubuntu-latest
            python-version: '3.12'
            numpy-spec: 'numpy>=2,<3'
          - os: ubuntu-latest
            python-version: '3.13'
            numpy-spec: 'numpy>=2,<3'
          # macOS + Python 3.10 ~ 3.13 + NumPy 2.x
          - os: macos-latest
            python-version: '3.10'
            numpy-spec: 'numpy>=2,<3'
          - os: macos-latest
            python-version: '3.11'
            numpy-spec: 'numpy>=2,<3'
          - os: macos-latest
            python-version: '3.12'
            numpy-spec: 'numpy>=2,<3'
          - os: macos-latest
            python-version: '3.13'
            numpy-spec: 'numpy>=2,<3'
          # Windows + Python 3.10 ~ 3.13 + NumPy 2.x
          - os: windows-latest
            python-version: '3.10'
            numpy-spec: 'numpy>=2,<3'
          - os: windows-latest
            python-version: '3.11'
            numpy-spec: 'numpy>=2,<3'
          - os: windows-latest
            python-version: '3.12'
            numpy-spec: 'numpy>=2,<3'
          - os: windows-latest
            python-version: '3.13'
            numpy-spec: 'numpy>=2,<3'

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv
    - name: Install dependencies
      run: |
        uv venv
        uv pip install "${{ matrix.numpy-spec }}" --group dev -e ".[pyopenjtalk]"
    - name: Check dependency resolution
      run: |
        uv pip check
    - name: Lint with Ruff
      run: |
        uv run --no-sync ruff check .
    - name: Test with pytest
      run: |
        uv run --no-sync python -W error::DeprecationWarning -m pytest
